<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Sorting Visualizer</title>
   <link rel="stylesheet" href="styles.css">
</head>

<h1>Sorting Visualizer</h1>
<select id="algorithm">
  <option value="bubble">Bubble Sort</option>
  <option value="selection">Selection Sort</option>
  <option value="insertion">Insertion Sort</option>
  <option value="merge">Merge Sort</option>
  <option value="quick">Quick Sort</option>
</select>
<button onclick="generateArray()">Generate New Array</button>
<button onclick="startSort()">Start Sorting</button>

<div id="array-container"></div>

<script>
  let array = [];
  const container = document.getElementById("array-container");

  function generateArray() {
    array = [];
    container.innerHTML = "";
    for (let i = 0; i < 30; i++) {
      const value = Math.floor(Math.random() * 300) + 20;
      array.push(value);
      const bar = document.createElement("div");
      bar.style.height = `${value}px`;
      bar.classList.add("bar");
      container.appendChild(bar);
    }
  }

  async function startSort() {
    const algo = document.getElementById("algorithm").value;
    switch (algo) {
      case "bubble":
        await bubbleSort();
        break;
      case "selection":
        await selectionSort();
        break;
      case "insertion":
        await insertionSort();
        break;
      case "merge":
        await mergeSort(0, array.length - 1);
        break;
      case "quick":
        await quickSort(0, array.length - 1);
        break;
    }
  }

  async function bubbleSort() {
    const bars = document.getElementsByClassName("bar");
    for (let i = 0; i < array.length - 1; i++) {
      for (let j = 0; j < array.length - i - 1; j++) {
        bars[j].style.backgroundColor = "red";
        bars[j + 1].style.backgroundColor = "red";
        await sleep(50);
        if (array[j] > array[j + 1]) {
          [array[j], array[j + 1]] = [array[j + 1], array[j]];
          bars[j].style.height = `${array[j]}px`;
          bars[j + 1].style.height = `${array[j + 1]}px`;
        }
        bars[j].style.backgroundColor = "teal";
        bars[j + 1].style.backgroundColor = "teal";
      }
      bars[array.length - i - 1].style.backgroundColor = "green";
    }
    bars[0].style.backgroundColor = "green";
  }

  async function selectionSort() {
    const bars = document.getElementsByClassName("bar");
    for (let i = 0; i < array.length; i++) {
      let minIndex = i;
      bars[i].style.backgroundColor = "orange";
      for (let j = i + 1; j < array.length; j++) {
        bars[j].style.backgroundColor = "red";
        await sleep(50);
        if (array[j] < array[minIndex]) {
          minIndex = j;
        }
        bars[j].style.backgroundColor = "teal";
      }
      if (minIndex !== i) {
        [array[i], array[minIndex]] = [array[minIndex], array[i]];
        bars[i].style.height = `${array[i]}px`;
        bars[minIndex].style.height = `${array[minIndex]}px`;
      }
      bars[i].style.backgroundColor = "green";
    }
  }

  async function insertionSort() {
    const bars = document.getElementsByClassName("bar");
    for (let i = 1; i < array.length; i++) {
      let key = array[i];
      let j = i - 1;
      bars[i].style.backgroundColor = "red";
      await sleep(50);
      while (j >= 0 && array[j] > key) {
        array[j + 1] = array[j];
        bars[j + 1].style.height = `${array[j]}px`;
        j--;
        await sleep(50);
      }
      array[j + 1] = key;
      bars[j + 1].style.height = `${key}px`;
      bars[i].style.backgroundColor = "teal";
    }
    for (let bar of bars) bar.style.backgroundColor = "green";
  }

  async function mergeSort(start, end) {
    if (start >= end) return;
    const mid = Math.floor((start + end) / 2);
    await mergeSort(start, mid);
    await mergeSort(mid + 1, end);
    await merge(start, mid, end);
  }

  async function merge(start, mid, end) {
    const bars = document.getElementsByClassName("bar");
    const left = array.slice(start, mid + 1);
    const right = array.slice(mid + 1, end + 1);
    let i = 0, j = 0, k = start;
    while (i < left.length && j < right.length) {
      await sleep(50);
      if (left[i] < right[j]) {
        array[k] = left[i];
        bars[k].style.height = `${left[i]}px`;
        i++;
      } else {
        array[k] = right[j];
        bars[k].style.height = `${right[j]}px`;
        j++;
      }
      k++;
    }
    while (i < left.length) {
      await sleep(50);
      array[k] = left[i];
      bars[k].style.height = `${left[i]}px`;
      i++; k++;
    }
    while (j < right.length) {
      await sleep(50);
      array[k] = right[j];
      bars[k].style.height = `${right[j]}px`;
      j++; k++;
    }
  }

  async function quickSort(low, high) {
    if (low < high) {
      let pi = await partition(low, high);
      await quickSort(low, pi - 1);
      await quickSort(pi + 1, high);
    }
  }

  async function partition(low, high) {
    const bars = document.getElementsByClassName("bar");
    let pivot = array[high];
    bars[high].style.backgroundColor = "red";
    let i = low - 1;
    for (let j = low; j < high; j++) {
      bars[j].style.backgroundColor = "yellow";
      await sleep(50);
      if (array[j] < pivot) {
        i++;
        [array[i], array[j]] = [array[j], array[i]];
        bars[i].style.height = `${array[i]}px`;
        bars[j].style.height = `${array[j]}px`;
      }
      bars[j].style.backgroundColor = "teal";
    }
    [array[i + 1], array[high]] = [array[high], array[i + 1]];
    bars[i + 1].style.height = `${array[i + 1]}px`;
    bars[high].style.height = `${array[high]}px`;
    bars[high].style.backgroundColor = "teal";
    return i + 1;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  generateArray(); // Load on startup
</script>
</body>
</html>
